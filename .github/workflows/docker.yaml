name: Build and Push Dinov3d Docker Image

on: [push, pull_request]


jobs:
  build:
    permissions:
        contents: read
        packages: write
    runs-on: ubuntu-latest
    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        path: .

    - name: Build dinov3d docker image
      run: sh ./dinov3_docker/docker-build.sh \
        "${{github.sha}}" "${{ github.repository_owner }}"

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner}}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Push dinov3d docker image
      run: sh ./dinov3_docker/docker-push.sh "${{ github.repository_owner }}"
